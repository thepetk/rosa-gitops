apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: lightspeed-stack-llm
  namespace: devcluster-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  resyncPeriod: 5m
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  folderRef: rhdh-ai-observability
  json: >
    {
      "uid": "lightspeed-stack-llm",
      "title": "Lightspeed Stack — LLM Usage",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "timezone": "browser",
      "panels": [

        {
          "type": "row",
          "title": "LLM Overview",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 1 }
        },

        {
          "type": "stat",
          "title": "Total LLM Calls",
          "description": "Total number of LLM calls made so far.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 0, "y": 1, "w": 6, "h": 5 },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] }
            }
          },
          "targets": [
            { "expr": "sum(ls_llm_calls_total)", "instant": true }
          ]
        },

        {
          "type": "stat",
          "title": "Failed LLM Calls",
          "description": "Total number of LLM calls that failed.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 6, "y": 1, "w": 6, "h": 5 },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 1 }] }
            }
          },
          "targets": [
            { "expr": "sum(ls_llm_calls_failures_total) or vector(0)", "instant": true }
          ]
        },

        {
          "type": "stat",
          "title": "Validation Errors",
          "description": "Total number of bad responses from the LLM.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 12, "y": 1, "w": 6, "h": 5 },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 5 }] }
            }
          },
          "targets": [
            { "expr": "sum(ls_llm_validation_errors_total) or vector(0)", "instant": true }
          ]
        },

        {
          "type": "stat",
          "title": "Active Provider/Model Pairs",
          "description": "Number of provider and model combinations currently set up.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 18, "y": 1, "w": 6, "h": 5 },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] }
            }
          },
          "targets": [
            { "expr": "count(ls_provider_model_configuration) or vector(0)", "instant": true }
          ]
        },

        {
          "type": "row",
          "title": "API Traffic",
          "gridPos": { "x": 0, "y": 6, "w": 24, "h": 1 }
        },

        {
          "type": "timeseries",
          "title": "REST API Call Rate",
          "description": "How many API requests are coming in per second, broken down by path and status code.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 0, "y": 7, "w": 12, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            { "expr": "rate(ls_rest_api_calls_total[5m])", "legendFormat": "{{ path }} {{ status_code }}" }
          ]
        },

        {
          "type": "timeseries",
          "title": "Response Duration p95",
          "description": "How long the slowest 5% of requests take to complete.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 12, "y": 7, "w": 12, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum by (le) (rate(ls_response_duration_seconds_bucket[5m])))" }
          ]
        },

        {
          "type": "row",
          "title": "LLM Call Rate by Model",
          "gridPos": { "x": 0, "y": 14, "w": 24, "h": 1 }
        },

        {
          "type": "timeseries",
          "title": "LLM Call Rate — 5m",
          "description": "LLM calls per second in the last 5 minutes, per model and provider.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 0, "y": 15, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            { "expr": "rate(ls_llm_calls_total[5m])", "legendFormat": "{{ model }} ({{ provider }})" }
          ]
        },

        {
          "type": "timeseries",
          "title": "LLM Call Rate — 1h",
          "description": "LLM calls per second in the last hour, per model and provider.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 8, "y": 15, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            { "expr": "rate(ls_llm_calls_total[1h])", "legendFormat": "{{ model }} ({{ provider }})" }
          ]
        },

        {
          "type": "timeseries",
          "title": "LLM Call Rate — 24h",
          "description": "LLM calls per second in the last 24 hours, per model and provider.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 16, "y": 15, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            { "expr": "rate(ls_llm_calls_total[1d])", "legendFormat": "{{ model }} ({{ provider }})" }
          ]
        },

        {
          "type": "row",
          "title": "Token Usage",
          "gridPos": { "x": 0, "y": 22, "w": 24, "h": 1 }
        },

        {
          "type": "timeseries",
          "title": "Tokens Sent Rate",
          "description": "How many tokens are being sent to the LLM per second, per model and provider.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 0, "y": 23, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "cps" } },
          "targets": [
            { "expr": "rate(ls_llm_token_sent_total[5m])", "legendFormat": "{{ model }} ({{ provider }})" }
          ]
        },

        {
          "type": "timeseries",
          "title": "Tokens Received Rate",
          "description": "How many tokens are coming back from the LLM per second. This is the best signal for cost and slowdowns.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 8, "y": 23, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "cps" } },
          "targets": [
            { "expr": "rate(ls_llm_token_received_total[5m])", "legendFormat": "{{ model }} ({{ provider }})" }
          ]
        },

        {
          "type": "timeseries",
          "title": "LLM Failure Rate",
          "description": "How many LLM calls are failing per second, per model and provider.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 16, "y": 23, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            { "expr": "rate(ls_llm_calls_failures_total[5m])", "legendFormat": "{{ model }} ({{ provider }})" }
          ]
        },

        {
          "type": "row",
          "title": "Query — Duration & Token Throughput",
          "gridPos": { "x": 0, "y": 30, "w": 24, "h": 1 }
        },

        {
          "type": "timeseries",
          "title": "Avg Query Duration per Model",
          "description": "Average end-to-end LLM call duration for non-streaming (query) requests, per model and provider. Lower is better.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 0, "y": 31, "w": 12, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            {
              "expr": "sum by (model, provider) (rate(ls_llm_duration_seconds_sum{call_type=\"query\"}[5m])) / sum by (model, provider) (rate(ls_llm_duration_seconds_count{call_type=\"query\"}[5m]))",
              "legendFormat": "{{ model }} ({{ provider }})"
            }
          ]
        },

        {
          "type": "timeseries",
          "title": "Query Token Throughput per Model",
          "description": "Output tokens received divided by total LLM processing time for non-streaming requests — tokens per second of model compute. Higher means the model generates more tokens per second it spends computing.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 12, "y": 31, "w": 12, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            {
              "expr": "sum by (model, provider) (rate(ls_llm_token_received_total{call_type=\"query\"}[5m])) / sum by (model, provider) (rate(ls_llm_duration_seconds_sum{call_type=\"query\"}[5m]))",
              "legendFormat": "{{ model }} ({{ provider }})"
            }
          ]
        },

        {
          "type": "row",
          "title": "Streaming — TTFT & Token Throughput",
          "gridPos": { "x": 0, "y": 38, "w": 24, "h": 1 }
        },

        {
          "type": "timeseries",
          "title": "TTFT p50 / p95 per Model",
          "description": "Time-to-first-token for streaming requests at the 50th and 95th percentile, per model and provider. Lower is better.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 0, "y": 39, "w": 12, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le, model, provider) (rate(ls_llm_ttft_seconds_bucket{call_type=\"streaming_query\"}[5m])))",
              "legendFormat": "p50 {{ model }} ({{ provider }})"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le, model, provider) (rate(ls_llm_ttft_seconds_bucket{call_type=\"streaming_query\"}[5m])))",
              "legendFormat": "p95 {{ model }} ({{ provider }})"
            }
          ]
        },

        {
          "type": "timeseries",
          "title": "Streaming Token Throughput per Model",
          "description": "Output tokens received divided by total stream duration for streaming requests — tokens per second of stream time. Higher means the model streams faster relative to how long the stream was open.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 12, "y": 39, "w": 12, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "targets": [
            {
              "expr": "sum by (model, provider) (rate(ls_llm_token_received_total{call_type=\"streaming_query\"}[5m])) / sum by (model, provider) (rate(ls_llm_stream_duration_seconds_sum{call_type=\"streaming_query\"}[5m]))",
              "legendFormat": "{{ model }} ({{ provider }})"
            }
          ]
        },

        {
          "type": "row",
          "title": "LLM Judge — Quality Scores",
          "gridPos": { "x": 0, "y": 46, "w": 24, "h": 1 }
        },

        {
          "type": "timeseries",
          "title": "Quality Score per Metric — 5m avg",
          "description": "Average LLM-as-a-judge quality score (0.0–1.0) per metric dimension over the last 5 minutes. Higher is better for all metrics.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 0, "y": 47, "w": 24, "h": 8 },
          "fieldConfig": {
            "defaults": { "unit": "percentunit", "min": 0, "max": 1 }
          },
          "targets": [
            {
              "expr": "sum by (metric_name) (rate(ls_llm_judge_score_sum[5m])) / sum by (metric_name) (rate(ls_llm_judge_score_count[5m]))",
              "legendFormat": "{{ metric_name }}"
            }
          ]
        },

        {
          "type": "stat",
          "title": "Answer Relevancy",
          "description": "Average answer relevancy score (0.0–1.0) over the last 5 minutes.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 0, "y": 55, "w": 4, "h": 4 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit", "min": 0, "max": 1,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "yellow", "value": 0.5 }, { "color": "green", "value": 0.75 }] }
            }
          },
          "targets": [
            { "expr": "sum(rate(ls_llm_judge_score_sum{metric_name=\"answer_relevancy\"}[5m])) / sum(rate(ls_llm_judge_score_count{metric_name=\"answer_relevancy\"}[5m]))", "instant": true }
          ]
        },

        {
          "type": "stat",
          "title": "Contextual Relevancy",
          "description": "Average contextual relevancy score (0.0–1.0) over the last 5 minutes.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 4, "y": 55, "w": 4, "h": 4 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit", "min": 0, "max": 1,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "yellow", "value": 0.5 }, { "color": "green", "value": 0.75 }] }
            }
          },
          "targets": [
            { "expr": "sum(rate(ls_llm_judge_score_sum{metric_name=\"contextual_relevancy\"}[5m])) / sum(rate(ls_llm_judge_score_count{metric_name=\"contextual_relevancy\"}[5m]))", "instant": true }
          ]
        },

        {
          "type": "stat",
          "title": "Helpfulness",
          "description": "Average helpfulness score (0.0–1.0) over the last 5 minutes.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 8, "y": 55, "w": 4, "h": 4 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit", "min": 0, "max": 1,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "yellow", "value": 0.5 }, { "color": "green", "value": 0.75 }] }
            }
          },
          "targets": [
            { "expr": "sum(rate(ls_llm_judge_score_sum{metric_name=\"helpfulness\"}[5m])) / sum(rate(ls_llm_judge_score_count{metric_name=\"helpfulness\"}[5m]))", "instant": true }
          ]
        },

        {
          "type": "stat",
          "title": "Prompt Alignment",
          "description": "Average prompt alignment score (0.0–1.0) over the last 5 minutes.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 12, "y": 55, "w": 4, "h": 4 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit", "min": 0, "max": 1,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "yellow", "value": 0.5 }, { "color": "green", "value": 0.75 }] }
            }
          },
          "targets": [
            { "expr": "sum(rate(ls_llm_judge_score_sum{metric_name=\"prompt_alignment\"}[5m])) / sum(rate(ls_llm_judge_score_count{metric_name=\"prompt_alignment\"}[5m]))", "instant": true }
          ]
        },

        {
          "type": "stat",
          "title": "Hallucination (absence)",
          "description": "Average hallucination-absence score (0.0–1.0) over the last 5 minutes. Higher means fewer hallucinations.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 16, "y": 55, "w": 4, "h": 4 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit", "min": 0, "max": 1,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "yellow", "value": 0.5 }, { "color": "green", "value": 0.75 }] }
            }
          },
          "targets": [
            { "expr": "sum(rate(ls_llm_judge_score_sum{metric_name=\"hallucination\"}[5m])) / sum(rate(ls_llm_judge_score_count{metric_name=\"hallucination\"}[5m]))", "instant": true }
          ]
        },

        {
          "type": "stat",
          "title": "Toxicity (absence)",
          "description": "Average toxicity-absence score (0.0–1.0) over the last 5 minutes. Higher means less toxic.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 20, "y": 55, "w": 2, "h": 4 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit", "min": 0, "max": 1,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "yellow", "value": 0.5 }, { "color": "green", "value": 0.75 }] }
            }
          },
          "targets": [
            { "expr": "sum(rate(ls_llm_judge_score_sum{metric_name=\"toxicity\"}[5m])) / sum(rate(ls_llm_judge_score_count{metric_name=\"toxicity\"}[5m]))", "instant": true }
          ]
        },

        {
          "type": "stat",
          "title": "Bias (absence)",
          "description": "Average bias-absence score (0.0–1.0) over the last 5 minutes. Higher means less biased.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 22, "y": 55, "w": 2, "h": 4 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit", "min": 0, "max": 1,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "yellow", "value": 0.5 }, { "color": "green", "value": 0.75 }] }
            }
          },
          "targets": [
            { "expr": "sum(rate(ls_llm_judge_score_sum{metric_name=\"bias\"}[5m])) / sum(rate(ls_llm_judge_score_count{metric_name=\"bias\"}[5m]))", "instant": true }
          ]
        }
      ]
    }
