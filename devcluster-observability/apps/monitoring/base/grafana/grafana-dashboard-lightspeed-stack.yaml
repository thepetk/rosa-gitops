apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: lightspeed-stack-llm
  namespace: devcluster-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  resyncPeriod: 5m
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  folderRef: rhdh-ai-observability
  json: >
    {
      "uid": "lightspeed-stack-llm",
      "title": "Lightspeed Stack — LLM Usage",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "timezone": "browser",
      "panels": [

        {
          "type": "row",
          "title": "LLM Overview",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 1 }
        },

        {
          "type": "stat",
          "title": "Total LLM Calls",
          "description": "Total number of LLM calls made so far.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 0, "y": 1, "w": 6, "h": 5 },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] }
            }
          },
          "targets": [
            { "expr": "sum(ls_llm_calls_total)", "instant": true }
          ]
        },

        {
          "type": "stat",
          "title": "Failed LLM Calls",
          "description": "Total number of LLM calls that failed.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 6, "y": 1, "w": 6, "h": 5 },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 1 }] }
            }
          },
          "targets": [
            { "expr": "sum(ls_llm_calls_failures_total) or vector(0)", "instant": true }
          ]
        },

        {
          "type": "stat",
          "title": "Validation Errors",
          "description": "Total number of bad responses from the LLM.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 12, "y": 1, "w": 6, "h": 5 },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 5 }] }
            }
          },
          "targets": [
            { "expr": "sum(ls_llm_validation_errors_total) or vector(0)", "instant": true }
          ]
        },

        {
          "type": "stat",
          "title": "Active Provider/Model Pairs",
          "description": "Number of provider and model combinations currently set up.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 18, "y": 1, "w": 6, "h": 5 },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] }
            }
          },
          "targets": [
            { "expr": "count(ls_provider_model_configuration) or vector(0)", "instant": true }
          ]
        },

        {
          "type": "row",
          "title": "API Traffic",
          "gridPos": { "x": 0, "y": 6, "w": 24, "h": 1 }
        },

        {
          "type": "timeseries",
          "title": "REST API Call Rate",
          "description": "How many API requests are coming in per second, broken down by path and status code.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 0, "y": 7, "w": 12, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            { "expr": "rate(ls_rest_api_calls_total[5m])", "legendFormat": "{{ path }} {{ status_code }}" }
          ]
        },

        {
          "type": "timeseries",
          "title": "Response Duration p95",
          "description": "How long the slowest 5% of requests take to complete.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 12, "y": 7, "w": 12, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum by (le) (rate(ls_response_duration_seconds_bucket[5m])))" }
          ]
        },

        {
          "type": "row",
          "title": "LLM Call Rate by Model",
          "gridPos": { "x": 0, "y": 14, "w": 24, "h": 1 }
        },

        {
          "type": "timeseries",
          "title": "LLM Call Rate — 5m",
          "description": "LLM calls per second in the last 5 minutes, per model and provider.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 0, "y": 15, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            { "expr": "rate(ls_llm_calls_total[5m])", "legendFormat": "{{ model }} ({{ provider }})" }
          ]
        },

        {
          "type": "timeseries",
          "title": "LLM Call Rate — 1h",
          "description": "LLM calls per second in the last hour, per model and provider.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 8, "y": 15, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            { "expr": "rate(ls_llm_calls_total[1h])", "legendFormat": "{{ model }} ({{ provider }})" }
          ]
        },

        {
          "type": "timeseries",
          "title": "LLM Call Rate — 24h",
          "description": "LLM calls per second in the last 24 hours, per model and provider.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 16, "y": 15, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            { "expr": "rate(ls_llm_calls_total[1d])", "legendFormat": "{{ model }} ({{ provider }})" }
          ]
        },

        {
          "type": "row",
          "title": "Token Usage",
          "gridPos": { "x": 0, "y": 22, "w": 24, "h": 1 }
        },

        {
          "type": "timeseries",
          "title": "Tokens Sent Rate",
          "description": "How many tokens are being sent to the LLM per second, per model and provider.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 0, "y": 23, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "cps" } },
          "targets": [
            { "expr": "rate(ls_llm_token_sent_total[5m])", "legendFormat": "{{ model }} ({{ provider }})" }
          ]
        },

        {
          "type": "timeseries",
          "title": "Tokens Received Rate",
          "description": "How many tokens are coming back from the LLM per second. This is the best signal for cost and slowdowns.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 8, "y": 23, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "cps" } },
          "targets": [
            { "expr": "rate(ls_llm_token_received_total[5m])", "legendFormat": "{{ model }} ({{ provider }})" }
          ]
        },

        {
          "type": "timeseries",
          "title": "LLM Failure Rate",
          "description": "How many LLM calls are failing per second, per model and provider.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 16, "y": 23, "w": 8, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            { "expr": "rate(ls_llm_calls_failures_total[5m])", "legendFormat": "{{ model }} ({{ provider }})" }
          ]
        },

        {
          "type": "row",
          "title": "Model Performance",
          "gridPos": { "x": 0, "y": 30, "w": 24, "h": 1 }
        },

        {
          "type": "timeseries",
          "title": "Avg LLM Call Duration per Model",
          "description": "Average call duration per model and provider. Non-streaming calls use ls_llm_duration_seconds; streaming calls use ls_llm_ttft_seconds (time-to-first-token) as the available latency signal.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 0, "y": 31, "w": 12, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "spanNulls": true } } },
          "targets": [
            {
              "expr": "sum by (model, provider, call_type) (rate(ls_llm_duration_seconds_sum[5m])) / sum by (model, provider, call_type) (rate(ls_llm_duration_seconds_count[5m]))",
              "legendFormat": "{{ model }} ({{ provider }}) {{ call_type }}"
            },
            {
              "expr": "sum by (model, provider) (rate(ls_llm_ttft_seconds_sum[5m])) / sum by (model, provider) (rate(ls_llm_ttft_seconds_count[5m]))",
              "legendFormat": "{{ model }} ({{ provider }}) ttft"
            }
          ]
        },

        {
          "type": "timeseries",
          "title": "LLM Call Duration p95 per Model",
          "description": "95th-percentile latency per model and provider. Non-streaming calls use ls_llm_duration_seconds; streaming calls use ls_llm_ttft_seconds (time-to-first-token).",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 12, "y": 31, "w": 12, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "spanNulls": true } } },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, model, provider) (rate(ls_llm_duration_seconds_bucket[5m])))",
              "legendFormat": "{{ model }} ({{ provider }}) p95"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le, model, provider) (rate(ls_llm_ttft_seconds_bucket[5m])))",
              "legendFormat": "{{ model }} ({{ provider }}) ttft p95"
            }
          ]
        },

        {
          "type": "row",
          "title": "Token Efficiency",
          "gridPos": { "x": 0, "y": 38, "w": 24, "h": 1 }
        },

        {
          "type": "timeseries",
          "title": "Tokens per LLM Call",
          "description": "Average total tokens (sent + received) per LLM call, per model and provider. Both sides are aggregated to model+provider to avoid label mismatch between token metrics (which have call_type) and ls_llm_calls_total (which does not).",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 0, "y": 39, "w": 12, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2, "spanNulls": true } } },
          "targets": [
            {
              "expr": "(sum by (model, provider) (rate(ls_llm_token_sent_total[5m])) + sum by (model, provider) (rate(ls_llm_token_received_total[5m]))) / sum by (model, provider) (rate(ls_llm_calls_total[5m]))",
              "legendFormat": "{{ model }} ({{ provider }})"
            }
          ]
        },

        {
          "type": "timeseries",
          "title": "Token Throughput by Direction",
          "description": "Total token flow per second broken down by sent vs received, per model and provider. Use this when label cardinality prevents dividing by call rate (call_type mismatch).",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 12, "y": 39, "w": 12, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "cps" } },
          "targets": [
            {
              "expr": "rate(ls_llm_token_sent_total[5m])",
              "legendFormat": "sent — {{ model }} ({{ provider }}) {{ call_type }}"
            },
            {
              "expr": "rate(ls_llm_token_received_total[5m])",
              "legendFormat": "received — {{ model }} ({{ provider }}) {{ call_type }}"
            }
          ]
        },

        {
          "type": "row",
          "title": "Model Efficiency",
          "gridPos": { "x": 0, "y": 46, "w": 24, "h": 1 }
        },

        {
          "type": "timeseries",
          "title": "Token Yield per Second of Call Duration",
          "description": "Avg tokens per call divided by avg call duration, per model and provider. Higher means the model returns more tokens for the time spent — a combined throughput and efficiency signal. Uses ls_llm_duration_seconds for non-streaming and ls_llm_ttft_seconds for streaming.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 0, "y": 47, "w": 12, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2, "spanNulls": true } } },
          "targets": [
            {
              "expr": "(\n  (sum by (model, provider) (rate(ls_llm_token_sent_total[5m])) + sum by (model, provider) (rate(ls_llm_token_received_total[5m])))\n  / sum by (model, provider) (rate(ls_llm_calls_total[5m]))\n)\n/\n(\n  sum by (model, provider) (rate(ls_llm_duration_seconds_sum[5m]))\n  / sum by (model, provider) (rate(ls_llm_duration_seconds_count[5m]))\n)",
              "legendFormat": "{{ model }} ({{ provider }})"
            },
            {
              "expr": "(\n  (sum by (model, provider) (rate(ls_llm_token_sent_total[5m])) + sum by (model, provider) (rate(ls_llm_token_received_total[5m])))\n  / sum by (model, provider) (rate(ls_llm_calls_total[5m]))\n)\n/\n(\n  sum by (model, provider) (rate(ls_llm_ttft_seconds_sum[5m]))\n  / sum by (model, provider) (rate(ls_llm_ttft_seconds_count[5m]))\n)",
              "legendFormat": "{{ model }} ({{ provider }}) streaming"
            }
          ]
        },

        {
          "type": "timeseries",
          "title": "Token Yield per Second — p95 Duration",
          "description": "Avg tokens per call divided by p95 call duration. Shows efficiency under worst-case latency conditions — a drop here signals tail-latency degradation even when the average looks healthy.",
          "datasource": { "type": "prometheus", "uid": "prometheus-user-workload" },
          "gridPos": { "x": 12, "y": 47, "w": 12, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2, "spanNulls": true } } },
          "targets": [
            {
              "expr": "(\n  (sum by (model, provider) (rate(ls_llm_token_sent_total[5m])) + sum by (model, provider) (rate(ls_llm_token_received_total[5m])))\n  / sum by (model, provider) (rate(ls_llm_calls_total[5m]))\n)\n/\nhistogram_quantile(0.95, sum by (le, model, provider) (rate(ls_llm_duration_seconds_bucket[5m])))",
              "legendFormat": "{{ model }} ({{ provider }}) p95"
            },
            {
              "expr": "(\n  (sum by (model, provider) (rate(ls_llm_token_sent_total[5m])) + sum by (model, provider) (rate(ls_llm_token_received_total[5m])))\n  / sum by (model, provider) (rate(ls_llm_calls_total[5m]))\n)\n/\nhistogram_quantile(0.95, sum by (le, model, provider) (rate(ls_llm_ttft_seconds_bucket[5m])))",
              "legendFormat": "{{ model }} ({{ provider }}) ttft p95"
            }
          ]
        }

      ]
    }
